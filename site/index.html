<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
    <title>文件管理器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #333; }
        h1 { font-size: 24px; font-weight: 500; color: #fff; }
        .subtitle { color: #666; font-size: 14px; }

        .breadcrumb { display: flex; align-items: center; gap: 4px; padding: 12px 20px; background: #0f1629; border-radius: 8px; margin-bottom: 16px; font-size: 14px; overflow-x: auto; white-space: nowrap; }
        .breadcrumb-item { color: #888; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: all 0.2s; }
        .breadcrumb-item:hover { background: #2a2a4a; color: #fff; }
        .breadcrumb-item.current { color: #4A90D9; cursor: default; }
        .breadcrumb-item.current:hover { background: transparent; }
        .breadcrumb-sep { color: #555; }

        .panel { background: #16213e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; background: #0f1629; color: #666; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2a4a; }
        td { padding: 12px 16px; border-bottom: 1px solid #1e1e3a; vertical-align: middle; }
        tr { transition: background 0.15s; cursor: pointer; }
        tr:hover { background: #1a1a3e; }
        tr:last-child td { border-bottom: none; }

        .name-cell { display: flex; align-items: center; gap: 12px; }
        .icon { font-size: 20px; }
        .folder-icon { color: #f0ad4e; }
        .file-icon { color: #5bc0de; }
        .file-name { color: #fff; text-decoration: none; }
        tr.folder-row .file-name { color: #4A90D9; }

        .size { color: #666; font-size: 13px; width: 120px; text-align: right; }
        .time { color: #666; font-size: 13px; width: 180px; }

        .empty-state { padding: 60px 20px; text-align: center; color: #555; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; display: block; }
        .empty-state .text { font-size: 16px; }

        .loading { padding: 40px; text-align: center; color: #666; }

        .info-bar { display: flex; gap: 24px; padding: 12px 20px; background: #0f1629; border-bottom: 1px solid #2a2a4a; font-size: 13px; color: #666; }
        .info-item { display: flex; align-items: center; gap: 6px; }
        .info-item span { color: #4A90D9; }

        @media (max-width: 768px) {
            .size, .time { display: none; }
            th:nth-child(3), th:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📁 文件管理器</h1>
            <span class="subtitle">点击文件夹进入 | 点击文件名下载</span>
        </header>

        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="info-bar" id="info-bar">
            <div class="info-item">当前目录: <span id="current-path">/</span></div>
            <div class="info-item">共 <span id="item-count">0</span> 项</div>
        </div>

        <div class="panel">
            <div id="content"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <script>
        const MOUNTS = [
            { path: '/costrict', name: 'costrict', icon: '📦' },
            { path: '/shenma-images', name: 'shenma-images', icon: '🖼️' },
            { path: '/costrict-static', name: 'costrict-static', icon: '📄' }
        ];

        let currentPath = [];
        let fileCache = {};

        async function fetchDir(url) {
            if (fileCache[url]) return fileCache[url];
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch');
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            fileCache[url] = doc;
            return doc;
        }

        function parseDir(doc) {
            const items = [];
            const links = doc.querySelectorAll('a');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (!href || href === '../' || href === '/') return;
                items.push({
                    name: href.replace(/\/$/, ''),
                    isDir: href.endsWith('/'),
                    href: href
                });
            });
            items.sort((a, b) => {
                if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
                return a.name.localeCompare(b.name);
            });
            return items;
        }

        function getMountInfo(pathParts) {
            if (pathParts.length === 0) return null;
            return MOUNTS.find(m => m.name === pathParts[0]) || null;
        }

        function getBaseUrl(pathParts) {
            if (pathParts.length === 0) return '/';
            return '/' + pathParts[0] + '/';
        }

        function getRelativePath(pathParts) {
            if (pathParts.length <= 1) return '/';
            return '/' + pathParts.slice(1).join('/') + '/';
        }

        function renderBreadcrumb() {
            let html = `<span class="breadcrumb-item" onclick="navigateTo([])">根目录</span>`;
            let current = '';
            currentPath.forEach((part, i) => {
                current += '/' + part;
                html += `<span class="breadcrumb-sep">/</span>`;
                if (i === currentPath.length - 1) {
                    html += `<span class="breadcrumb-item current">${part}</span>`;
                } else {
                    html += `<span class="breadcrumb-item" onclick="navigateTo([${currentPath.slice(0, i + 1).map(p => "'" + p + "'").join(',')}])">${part}</span>`;
                }
            });
            document.getElementById('breadcrumb').innerHTML = html;
        }

        function renderTable(items) {
            const mount = getMountInfo(currentPath);
            const mountIcon = mount ? mount.icon : '📁';
            const mountName = mount ? mount.name : '目录';

            if (currentPath.length === 0) {
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th class="size">类型</th>
                                <th class="time">路径</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                MOUNTS.forEach(m => {
                    html += `
                        <tr class="folder-row" onclick="navigateTo(['${m.name}'])">
                            <td>
                                <div class="name-cell">
                                    <span class="icon folder-icon">${m.icon}</span>
                                    <span class="file-name">${m.name}</span>
                                </div>
                            </td>
                            <td class="size">目录</td>
                            <td class="time">${m.path}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                return html;
            }

            if (items.length === 0) {
                return `<div class="empty-state"><span class="icon">📭</span><span class="text">目录为空</span></div>`;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th class="size">大小</th>
                            <th class="time">最后修改</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (currentPath.length > 1) {
                html += `
                    <tr class="folder-row" onclick="navigateTo([${currentPath.slice(0, -1).map(p => "'" + p + "'").join(',')}])">
                        <td>
                            <div class="name-cell">
                                <span class="icon folder-icon">⬆️</span>
                                <span class="file-name">..</span>
                            </div>
                        </td>
                        <td class="size">-</td>
                        <td class="time">-</td>
                    </tr>
                `;
            }

            items.forEach(item => {
                const icon = item.isDir ? '📁' : '📄';
                const iconClass = item.isDir ? 'folder-icon' : 'file-icon';
                const rowClass = item.isDir ? 'folder-row' : '';
                const fullPath = '/' + currentPath.join('/') + '/' + item.name;

                if (item.isDir) {
                    html += `
                        <tr class="${rowClass}" onclick="navigateTo([${currentPath.map(p => "'" + p + "'").join(',')}, '${item.name}'])">
                            <td>
                                <div class="name-cell">
                                    <span class="icon ${iconClass}">${icon}</span>
                                    <span class="file-name">${item.name}</span>
                                </div>
                            </td>
                            <td class="size">-</td>
                            <td class="time">-</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>
                                <div class="name-cell">
                                    <span class="icon ${iconClass}">${icon}</span>
                                    <a href="${fullPath}" class="file-name" download="${item.name}" onclick="event.stopPropagation()">${item.name}</a>
                                </div>
                            </td>
                            <td class="size">-</td>
                            <td class="time">-</td>
                        </tr>
                    `;
                }
            });
            html += '</tbody></table>';
            return html;
        }

        async function navigateTo(pathArray) {
            currentPath = pathArray;
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = '<div class="loading">加载中...</div>';
            renderBreadcrumb();

            document.getElementById('current-path').textContent = '/' + currentPath.join('/');

            if (currentPath.length === 0) {
                document.getElementById('item-count').textContent = MOUNTS.length;
                contentEl.innerHTML = renderTable([]);
                return;
            }

            try {
                const baseUrl = getBaseUrl(currentPath);
                const relativePath = getRelativePath(currentPath);
                const doc = await fetchDir(baseUrl + relativePath);
                const items = parseDir(doc);
                document.getElementById('item-count').textContent = items.length;
                contentEl.innerHTML = renderTable(items);
            } catch (e) {
                contentEl.innerHTML = `<div class="empty-state"><span class="icon">❌</span><span class="text">无法加载目录: ${e.message}</span></div>`;
            }
        }

        navigateTo([]);
    </script>
</body>
</html>
