version: '3.8'

services:
  portal:
    image: nginx:1.27.1
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ../packages:/var/www/costrict
      - ../images:/var/www/shenma-images
      - ../costrict-static:/var/www/costrict-static
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./index.html:/var/www/index.html
    ports:
      - "80:80/tcp"
    networks:
      - shenma

networks:
  shenma:
    driver: bridge

