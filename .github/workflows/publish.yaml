name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-artifact:
    name: Release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read artifact ID from artifact-latest
        id: artifact
        run: |
          if [ ! -f ./artifact-latest ]; then
            echo "::error::artifact-latest file not found"
            exit 1
          fi
          ARTIFACT_NAME=$(cat ./artifact-latest | tr -d '[:space:]')
          if [ -z "${ARTIFACT_NAME}" ]; then
            echo "::error::artifact-latest is empty"
            exit 1
          fi
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Artifact name: ${ARTIFACT_NAME}"

      - name: Download artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yaml
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: artifact/
          branch: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifact/**
          generate_release_notes: true
