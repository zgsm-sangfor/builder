name: Build and Release costrict-mirror.tar.gz

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build And Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} -> Version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          echo "$ENV_CONTENT" > .env
          echo ".env file generated from ENV_FILE_CONTENT secret"

      - name: Save COSTRICT_PRIVATE_PEM
        env:
          PEM_CONTENT: ${{ secrets.COSTRICT_PRIVATE_PEM }}
        run: |
          echo "$PEM_CONTENT" > ./costrict-private.pem
          chmod 600 ./costrict-private.pem
          echo "costrict-private.pem file generated from COSTRICT_PRIVATE_PEM secret"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          # 从 .env 读取 prod 环境配置并添加 host key
          source .env
          ssh-keyscan -p ${prod_port} ${prod_host} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run build-costrict.sh
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_FIRST: 1
        run: |
          chmod +x *.sh
          ./build-costrict.sh --update --build all --pack all --version "${{ env.VERSION }}"

      - name: Run build-mirror.sh
        env:
          GITHUB_FIRST: 1
        run: |
          chmod +x *.sh
          ./build-mirror.sh --ignore-images --github-first

      - name: Prepare package repository artifact
        run: |
          rm -rf artifact
          mkdir -p artifact
          mkdir -p packages
          cp packages.json packages/
          tar -czf artifact/packages.tar.gz packages
          cp ./costrict-mirror.tar.gz artifact/
          cp ./costrict-mirror.tar.gz "artifact/costrict-mirror-${VERSION}.tar.gz"

      - name: Upload package repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: costrict-packages-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "chore: auto build and update packages [skip ci]"
            # 该 workflow 由 tag 触发，checkout 后处于 detached HEAD 状态，
            # 本地不存在 main 分支，直接 push origin main 会报
            # "src refspec main does not match any"，因此改用 HEAD:main
            git push origin HEAD:main
            echo "Changes committed and pushed"
          else
            echo "No changes to commit"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifact/**
        env:
          GITHUB_TOKEN: ${{ github.token }}
