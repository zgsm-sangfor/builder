name: Current Program Package Artifact

on:
  push:
    branches:
      - actions-full-package-artifact
  workflow_dispatch:

jobs:
  build-current-program-package:
    name: Build Current Program Package Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      GH_RELEASE_TOKEN: ${{ secrets.COSTRICT_ADMIN_RELEASE_TOKEN || secrets.PAT_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip rsync

      - name: Generate .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::ENV_FILE_CONTENT secret is required"
            exit 1
          fi
          echo "$ENV_CONTENT" > .env

      - name: Save signing key
        env:
          PEM_CONTENT: ${{ secrets.COSTRICT_PRIVATE_PEM }}
        run: |
          if [ -z "$PEM_CONTENT" ]; then
            echo "::error::COSTRICT_PRIVATE_PEM secret is required"
            exit 1
          fi
          echo "$PEM_CONTENT" > costrict-private.pem
          chmod 600 costrict-private.pem

      - name: Download current program release binaries
        run: |
          chmod +x *.sh
          ADMIN_VERSION="$(jq -r '.version' depends/costrict-admin.json)"
          DAEMON_VERSION="$(jq -r '.version' depends/costrict-daemon.json)"

          ./github-fetch-release.sh \
            --package costrict-admin \
            --repo zgsm-sangfor/costrict-admin \
            --os linux \
            --arch amd64 \
            --version "$ADMIN_VERSION" \
            --output "packages/costrict-admin/linux/amd64/${ADMIN_VERSION}/costrict-admin"

          ./github-fetch-release.sh \
            --package costrict-daemon \
            --repo zgsm-sangfor/costrict-admin \
            --os linux \
            --arch amd64 \
            --version "$DAEMON_VERSION" \
            --output "packages/costrict-daemon/linux/amd64/${DAEMON_VERSION}/costrict-daemon"

      - name: Build current program install packages
        run: |
          chmod +x *.sh
          ./build-components.sh --packages costrict-admin,costrict-daemon --clean --build --pack --index

      - name: Prepare artifact
        run: |
          rm -rf artifact
          mkdir -p artifact/packages
          cp -a packages/costrict-admin artifact/packages/
          cp -a packages/costrict-daemon artifact/packages/

      - name: Upload current program package artifact
        uses: actions/upload-artifact@v4
        with:
          name: costrict-current-program-packages-${{ github.ref_name }}-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
