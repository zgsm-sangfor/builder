server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"  # debug, release, test


jwtSettings:
  enable: true
  userIdField: ["properties","oauth_Custom_id"]
  userNameField: ["properties","oauth_Custom_username"]
  headerKey: [] # 除了authorization 外的Key,自动去除Bearer

logger:
  level: "debug"         # debug, info, warn, error
  format: "json"     # json, console
  output: "console"        # console, file, both
  # filename: "logs/app.log"  # 日志文件路径
  # max_size: 100         # 单个日志文件最大大小，单位MB
  # max_backups: 5        # 保留的旧日志文件最大数量
  # max_age: 30           # 旧日志文件最多保留天数
  # compress: true        # 是否压缩旧日志文件

# Nacos 连接配置（通用，可被多个业务订阅者复用）
nacos:
  serverAddr: "127.0.0.1"
  serverPort: 8848           # Nacos HTTP 端口
  grpcPort: 9848             # Nacos gRPC 端口
  username: ""
  password: ""
  namespace: "your-namespace-id"

# 模型配置订阅目标（与 Nacos 连接配置独立）
modelConfig:
  dataId: "model-config"
  group: "DEFAULT_GROUP"
  fallbackFile: "models.json"  # Nacos 不可用时的本地回退文件,可以用于测试

# 反向代理设置
# 反向代理设置
proxySetting:
  # 建立连接超时
  dialTimeout: 30
  # 探测间隔
  dialKeepAlive: 30
  # 全局最大空闲连接数
  maxIdleConns: 0
  # maxConnsPerHost 限制向同一上游 Host 最大空闲数
  maxIdleConnsPerHost: 200
  # maxConnsPerHost 限制向同一上游 Host 同时存在的 TCP 连接总数（活跃+空闲）。
  # 设置此值可防止批量请求耗尽本地临时端口，避免 "connect: cannot assign requested address"。
  # 建议根据上游并发承载能力调整，默认 0，不限制。
  maxConnsPerHost: 0
  # 空闲连接超时时间，0不限制
  idleConnTimeout: 180
  # forceAttemptHTTP2 是否强制尝试 HTTP/2（通过 ALPN 协商）。
  # 仅在上游使用 HTTPS 且服务端支持 h2 时有效；对明文 HTTP 上游无效。
  # HTTP/2 支持多路复用，可大幅减少并发 SSE 所需的 TCP 连接数。
  # 默认 false，启用前请确认上游支持 h2。
  forceAttemptHTTP2: false