services:
  efficiency-dashboard-kbcli:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_KBCLI}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    # ports:
    #   - "${PORT_EFFICIENCY_DASHBOARD_KBCLI}:8080"
    volumes:
      - ./config/kbcli/config.yaml:/app/config.yaml:ro
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/user-indicator/task:/app/task:ro
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/user-indicator/repo:/app/repo:ro
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/analysed:/app/analysed
    networks:
      - shenma
