services:
  efficiency-dashboard-portal:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_PORTAL}
    restart: unless-stopped
    depends_on:
      - efficiency-dashboard-server
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${PORT_EFFICIENCY_DASHBOARD_PORTAL}:80"
    volumes:
      - ./config/portal/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - shenma
