services:
  efficiency-dashboard-portal:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_PORTAL}
    restart: unless-stopped
    depends_on:
      - efficiency-dashboard-server
    environment:
      TZ: Asia/Shanghai
    # ports:
    #   - "${PORT_EFFICIENCY_DASHBOARD_PORTAL}:80"
    volumes:
      - ./config/portal/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shenma
