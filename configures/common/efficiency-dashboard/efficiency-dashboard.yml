services:
  efficiency-postgresql:
    image: ${IMAGE_POSTGRES}
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
      POSTGRES_DB: report
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/postgresql/data:/var/lib/postgresql/data
    networks:
      - shenma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d report"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  efficiency-dashboard-backend:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_BACKEND}
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/backend/logs:/app/logs
      - ./config/server:/app/config
    networks:
      - shenma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9990/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  efficiency-dashboard-portal:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_PORTAL}
    restart: always
    volumes:
      - ./config/portal/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/portal/static:/var/www/static:ro
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/portal/login:/var/www/login:ro
    networks:
      - shenma
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  efficiency-dashboard-kbcli:
    image: ${IMAGE_EFFICIENCY_DASHBOARD_KBCLI}
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/kbcli/logs:/app/logs
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/kbcli/task:/app/task/raw/task
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/kbcli/repo:/app/task/raw/repo
      - ${COSTRICT_DATA_DIR}/backend/efficiency-dashboard/kbcli/analysed:/app/analysed
      - ./config/kbcli:/app/config
    networks:
      - shenma
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
