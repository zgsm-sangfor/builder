services:
  casdoor:
    image: ${IMAGE_CASDOOR}
    restart: always
    ports:
      - "${PORT_CASDOOR}:8000"
    environment:
      driverName: postgres
      dataSourceName: "host=postgres port=5432 user=${POSTGRES_USER} password=${PASSWORD_POSTGRES} dbname=casdoor sslmode=disable"
      initDataFile: "/init_data.json"
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/casdoor/logs:/data/logs
      - ./conf/app.conf:/conf/app.conf
    networks:
      - shenma