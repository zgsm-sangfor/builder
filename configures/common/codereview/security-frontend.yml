services:
  # Security 前端服务 (Nginx)
  security-frontend:
    image: ${IMAGE_SECURITY_FRONTEND}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/security_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - security-backend
      - security-agent-pipeline
    networks:
      shenma:
        aliases:
          - security-frontend
