services:
  review-manager:
    image: ${IMAGE_REVIEW_MANAGER}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${PASSWORD_POSTGRES}
      DATABASE_NAME: codereview
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/review-manager/logs:/app/logs
      - ${COSTRICT_DATA_DIR}/backend/codereview/workspaces:/home/appuser/Workspaces
      - ./config/review-manager:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      shenma:
        aliases:
          - review-manager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  review-worker:
    image: ${IMAGE_REVIEW_MANAGER}
    command: ["/bin/sh", "-c", "./review-manager worker"]
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${PASSWORD_POSTGRES}
      DATABASE_NAME: codereview
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/review-worker/logs:/app/logs
      - ${COSTRICT_DATA_DIR}/backend/codereview/workspaces:/home/appuser/Workspaces
      - ./config/review-manager:/app/config
    depends_on:
      review-manager:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - shenma
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]eview-manager worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  issue-manager:
    image: ${IMAGE_ISSUE_MANAGER}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${PASSWORD_POSTGRES}
      DATABASE_NAME: codereview
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/issue-manager/logs:/app/logs
      - ./config/issue-manager:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      shenma:
        aliases:
          - issue-manager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  review-checker:
    image: ${IMAGE_REVIEW_CHECKER}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${PASSWORD_POSTGRES}
      DATABASE_NAME: codereview
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 2
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/review-checker/logs:/app/logs
      - ./config/review-checker:/app/config
      - ./config/base/.config/costrict/costrict.json:/app/base/.config/costrict/costrict.json:ro
      - ./config/base/cclsp.json:/app/base/cclsp.json:ro
      - ./config/base/prompts/CodeReviewerPrompt.md:/app/base/prompts/CodeReviewerPrompt.md:ro
      - ./config/base/prompts/ReflectionAgentPrompt.md:/app/base/prompts/ReflectionAgentPrompt.md:ro
      - ${COSTRICT_DATA_DIR}/backend/codereview/workspaces:/home/appuser/Workspaces
    depends_on:
      review-manager:
        condition: service_started
      issue-manager:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 5G
        reservations:
          cpus: '1.0'
          memory: 2G
    networks:
      - shenma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # GitLab CE (Omnibus 包含所有依赖服务)
  gitlab:
    image: ${IMAGE_GITLAB}
    hostname: 'gitlab.local'
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '${PORT_GITLAB_HTTP:-8090}:80'
      - '${PORT_GITLAB_HTTPS:-8443}:443'
      - '${PORT_GITLAB_SSH:-2222}:22'
    volumes:
      - ./config/gitlab:/etc/gitlab
      - ${COSTRICT_DATA_DIR}/backend/codereview/gitlab/logs:/var/log/gitlab
      - ${COSTRICT_DATA_DIR}/backend/codereview/gitlab/data:/var/opt/gitlab
    environment:
      GITLAB_ROOT_PASSWORD: Sangfor@123
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:80'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        # 禁用部分服务以节省内存
        prometheus['enable'] = false
        alertmanager['enable'] = false
        postgresql['shared_buffers'] = '256MB'
        # 减少 puma worker 数量以节省共享内存
        puma['worker_processes'] = 4
        puma['min_threads'] = 2
        puma['max_threads'] = 4
    shm_size: '2g'
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    networks:
      - shenma

  # Security 后端服务 (Django)
  security-backend:
    image: ${IMAGE_SECURITY_BACKEND}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=admin@123.
      - ALLOWED_HOSTS=*
      - DEBUG_CONFIG=0
      - DATABASE_NAME=${POSTGRES_DB:-codereview}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${PASSWORD_POSTGRES}
      - DB_HOST=postgres
      - DB_PORT=5432
      - UC_SERVER_ADDR=http://20.20.1.28:8000
      - SESSION_COOKIE_AGE=172800
      - SESSION_EXPIRE_AT_BROWSER_CLOSE=0
      - SESSION_REFRESH_TOKEN_EXPIRE_TIME=7200
      - WORKFLOW_ALLOW=1
      - REPORT_2PDF_API=http://security-agent-pipeline:8000/report/report2pdf
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/codereview/security/log:/DevSecOps/dc/log
      - ${COSTRICT_DATA_DIR}/backend/codereview/security/static:/DevSecOps/dc/static
      - ${COSTRICT_DATA_DIR}/backend/codereview/security/public:/DevSecOps/dc/public
      - ${COSTRICT_DATA_DIR}/backend/codereview/security/tmp:/DevSecOps/dc/tmp
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    networks:
      - shenma

  # Security 前端服务 (Nginx)
  security-frontend:
    image: ${IMAGE_SECURITY_FRONTEND}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/security_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - security-backend
      - security-agent-pipeline
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      shenma:
        aliases:
          - security-frontend

  # Security Agent Pipeline (FastAPI)
  security-agent-pipeline:
    image: ${IMAGE_SECURITY_AGENT_PIPELINE}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "git config --global --add safe.directory '*' && fastapi run web.py"]
    volumes:
      - ./config/base/.config/costrict/costrict.json:/app/aiagent-sast/data/costrict/costrict.json:ro
      - ${COSTRICT_DATA_DIR}/backend/codereview/agent_pipeline/log:/app/aiagent-sast/log
      - ./config/agent_pipeline/data:/app/aiagent-sast/data
      - ${COSTRICT_DATA_DIR}/backend/codereview/agent_pipeline/tmp:/tmp_data
      - ${COSTRICT_DATA_DIR}/backend/codereview/agent_pipeline/ci_threat_logs:/app/threat-explorer/logs
      - ${COSTRICT_DATA_DIR}/backend/codereview/agent_pipeline/ci_audit_logs:/app/SecAuditAgent/logs
      - ${COSTRICT_DATA_DIR}/backend/codereview/workspaces:/home/appuser/Workspaces
      - /root/.costrict/projects:/root/.costrict/projects
      - /root/.costrict/raw-dump:/root/.costrict/raw-dump
    environment:
      - PYTHONUNBUFFERED=1
      - CSC_DISABLE_RAW_DUMP=1
      - CHROMIUM_PATH=/usr/lib/chrome-linux/chrome
      - COSTRICT_CONFIG=/app/aiagent-sast/data/costrict/costrict.json
      - COSTRICT_DISABLE_DEFAULT_PLUGINS=1
      - OPENCODE_DISABLE_DEFAULT_PLUGINS=1
      - PLATFORM=http://security-backend:5000
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 4G
    networks:
      - shenma
