server {
    listen       80;
    gzip on;
    gzip_min_length  1000;
    gzip_buffers     4 8k;
    gzip_http_version 1.1;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml;

    server_name  localhost;
    client_max_body_size 2048M;
    server_tokens off;

    # 前端静态资源部署路径改为 /llm_sast/
    location /llm_sast/ {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ @router;
    }

    location @router {
        rewrite ^.*$ /llm_sast/index.html last;
    }

    # 新增 llm_sast 前缀的代理配置
    location /llm_sast/sast/ {
        proxy_pass http://security-backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /llm_sast/agent/ {
        proxy_pass http://security-agent-pipeline:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /llm_sast/api/ {
        proxy_pass http://security-agent-pipeline:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
