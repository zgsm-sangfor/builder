services:
  costrict-web-gateway:
    image: ${IMAGE_COSTRICT_WEB_GATEWAY}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      GATEWAY_PORT: "8081"
      SERVER_URL: "http://costrict-web-api:8080"
      GATEWAY_ID: "gw-01"
      GATEWAY_ENDPOINT: "${COSTRICT_BASEURL}/cloud-gateway"
      GATEWAY_INTERNAL_URL: "http://costrict-web-gateway:8081"
      GATEWAY_REGION: "default"
      GATEWAY_CAPACITY: "100"
      INTERNAL_SECRET: "server-gateway-password"
      # Nacos 动态 endpoint（与 k8s gateway-values.yaml 对齐）
      # GATEWAY_NACOS_SERVER_ADDR: "nacos:8848"
      # GATEWAY_NACOS_NAMESPACE_ID: "costrict"
      # GATEWAY_NACOS_GROUP: "COSTRICT_WEB"
      # GATEWAY_NACOS_DATA_ID: "gateway-endpoint"
      # GATEWAY_NACOS_TIMEOUT_MS: "5000"
      # GATEWAY_NACOS_USERNAME: "costrict"
      # GATEWAY_NACOS_PASSWORD: "costrict"
      # GATEWAY_NACOS_ACCESS_TOKEN: ""
      # GATEWAY_NACOS_API_BASE_URL_DATA_ID: "gateway-endpoint"
      # GATEWAY_API_BASE_URL: "gateway-api-base-url"
    ports:
      - "${PORT_COSTRICT_WEB_GATEWAY:-30277}:8081/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
