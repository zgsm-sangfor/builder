services:
  costrict-web-postgres:
    image: ${IMAGE_COSTRICT_WEB_POSTGRES}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_DB: costrict_db
      POSTGRES_USER: costrict
      POSTGRES_PASSWORD: ${PASSWORD_COSTRICT_WEB_DB}
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/postgres/data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costrict -d costrict_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shenma

  costrict-web-api:
    image: ${IMAGE_COSTRICT_WEB_API}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      PORT: "8080"
      LOG_LEVEL: "info"
      DB_HOST: costrict-web-postgres
      DB_PORT: 5432
      DB_NAME: costrict_db
      DB_USER: costrict
      DB_PASSWORD: ${PASSWORD_COSTRICT_WEB_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/artifacts:/app/data/artifacts
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/api/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-postgres:
        condition: service_healthy

  costrict-web-gateway:
    image: ${IMAGE_COSTRICT_WEB_GATEWAY}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      GATEWAY_PORT: "8081"
      SERVER_URL: "http://costrict-web-api:8080"
      GATEWAY_REGION: "default"
      GATEWAY_CAPACITY: "100"
    ports:
      - "${PORT_COSTRICT_WEB_GATEWAY:-30276}:8081/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-api:
        condition: service_healthy

  costrict-web-portal:
    image: ${IMAGE_COSTRICT_WEB_PORTAL}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      API_URL: "http://costrict-web-api:8080"
    ports:
      - "${PORT_COSTRICT_WEB_PORTAL:-32440}:3000/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-api:
        condition: service_healthy

  costrict-web-proxy:
    image: ${IMAGE_COSTRICT_WEB_PROXY}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      LISTEN_ADDR: ":8090"
      SERVER_URL: "http://costrict-web-api:8080"
      LOG_LEVEL: "info"
      FILTER_FAILURE_MODE: "block"
      AUDIT_RETENTION_DAYS: "90"
    ports:
      - "${PORT_COSTRICT_WEB_PROXY:-30290}:8090/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-api:
        condition: service_healthy

  costrict-web-worker:
    image: ${IMAGE_COSTRICT_WEB_WORKER}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      LOG_LEVEL: "info"
      CONCURRENCY: "5"
      DB_HOST: costrict-web-postgres
      DB_PORT: 5432
      DB_NAME: costrict_db
      DB_USER: costrict
      DB_PASSWORD: ${PASSWORD_COSTRICT_WEB_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/worker/logs:/app/logs
    networks:
      - shenma
    depends_on:
      costrict-web-postgres:
        condition: service_healthy
      costrict-web-api:
        condition: service_healthy
