services:
  costrict-web-api:
    image: ${IMAGE_COSTRICT_WEB_API}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      PORT: "8080"
      LOG_LEVEL: "info"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: costrict_db
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${PASSWORD_POSTGRES}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/artifacts:/app/data/artifacts
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/api/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      postgres:
        condition: service_healthy
