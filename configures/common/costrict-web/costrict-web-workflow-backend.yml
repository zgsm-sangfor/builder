services:
  costrict-web-workflow-backend:
    image: ${IMAGE_COSTRICT_WEB_WORKFLOW_BACKEND}
    restart: always
    user: "1000:1000"
    environment:
      TZ: "Asia/Shanghai"
      PORT: "8080"
      APP_ENV: "production"
      LOG_LEVEL: "info"
      ALLOW_SIGNUP: "true"
      CORS_ALLOWED_ORIGINS: "${COSTRICT_BASEURL}"
      # 本地上传
      LOCAL_UPLOAD_DIR: "/app/data/uploads"
      LOCAL_UPLOAD_BASE_URL: "${COSTRICT_BASEURL}/workflow-backend"
      # Cloud Fleet（gateway）
      MULTICA_CLOUD_FLEET_URL: "http://costrict-web-gateway:8081"
      # Casdoor SSO（与 k8s workflow-values.yaml 对齐）
      CASDOOR_ENDPOINT: "http://casdoor:8000"
      CASDOOR_PUBLIC_ENDPOINT: "${COSTRICT_BASEURL}"
      CASDOOR_REDIRECT_URI: "${COSTRICT_BASEURL}/workflow-web/auth/casdoor/callback"
      CASDOOR_ORG_NAME: "built-in"
      CASDOOR_APP_NAME: "app-built-in"
      CASDOOR_CLIENT_ID: "${OIDC_AUTH_CLIENT_ID}"
      CASDOOR_CLIENT_SECRET: "${OIDC_AUTH_CLIENT_SECRET}"
      NEXT_PUBLIC_CASDOOR_LOGIN_URL: "/workflow-web/auth/casdoor/login"
      # 部门 / cs-user / team / cloud-api
      DEPT_SYNC_BASE_URL: "http://costrict-dept-sync:8080/costrict-dept-info/api/v1"
      DEPT_SYNC_QUERY_KEY: "${APIKEY_COSTRICT_WEB_DEPT_SYNC_QUERY:-costrict}"
      CS_USER_API_BASE_URL: "http://costrict-web-cs-user:8081"
      CS_USER_INTERNAL_TOKEN: "${PASSWORD_COSTRICT_WEB_CS_USER_TOKEN}"
      TEAM_NAMESPACE_API_BASE_URL: "http://costrict-web-api:8080"
      TEAM_NAMESPACE_TENANT_ID: "default"
      TEAM_NAMESPACE_INTERNAL_SERVICE_TOKEN: "${COSTRICT_WEB_INTERNAL_SECRET}"
      CLOUD_API_BASE_URL: "http://costrict-web-api:8080"
      # Gitea 插件市场
      CSC_PLUGIN_MARKETPLACE_NAME: "costrict-plugins"
      CSC_PLUGIN_MARKETPLACE_REPO: "${COSTRICT_BASEURL}/cloud-api/api/marketplace/costrict-plugins/marketplace.json"
      GITEA_BASE_URL: "http://${COSTRICT_HOST}:33000"
      GITEA_PUBLIC_BASE_URL: "http://${COSTRICT_HOST}:33000"
      # workflow 角色 LLM（当前关闭）
      WORKFLOW_ROLE_RESOLUTION_ENABLED: "false"
      WORKFLOW_ROLE_LLM_PROVIDER: ""
      WORKFLOW_ROLE_LLM_MODEL: ""
      WORKFLOW_ROLE_LLM_BASE_URL: ""
      WORKFLOW_ROLE_LLM_API_KEY: ""
      WORKFLOW_ROLE_LLM_MAX_OUTPUT_TOKENS: "4096"
      WORKFLOW_ROLE_LLM_TEMPERATURE: "0"
      WORKFLOW_ROLE_LLM_TIMEOUT_SECONDS: "30"
      WORKFLOW_ROLE_LLM_MAX_CANDIDATES: "200"
      WORKFLOW_ROLE_LLM_MAX_SLOTS: "50"
      WORKFLOW_ROLE_LLM_MAX_INPUT_CHARS: "100000"
      WORKFLOW_ROLE_WORKER_CONCURRENCY: "2"
      WORKFLOW_ROLE_MAX_ACTIVE_JOBS_PER_WORKSPACE: "5"
      # 数据库 / 密钥
      DATABASE_URL: "postgres://${POSTGRES_USER}:${PASSWORD_POSTGRES}@postgres:5432/costrict_workflow?sslmode=disable"
      JWT_SECRET: "${PASSWORD_COSTRICT_WEB_JWT_SECRET}"
      # 只能走 extraEnv 的变量（cmd/server/main.go、internal/handler/config.go 读取）
      COSTRICT_API_INTERNAL: "http://costrict-web-api:8080"
      COSTRICT_INTERNAL_SECRET: "${COSTRICT_WEB_INTERNAL_SECRET}"
      SERVER_URL: "${COSTRICT_BASEURL}/workflow-web"
      BUILTIN_PLUGIN_API_BASE_URL: "http://costrict-web-api:8080"
      MULTICA_INTEGRATION_SECRET: "${PASSWORD_COSTRICT_WEB_MULTICA_SECRET}"
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-web/workflow/data:/app/data
    # ports:
    #   - "${PORT_COSTRICT_WEB_WORKFLOW_BACKEND:-32056}:8080/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - shenma
    depends_on:
      postgres:
        condition: service_healthy
