services:
  costrict-web-portal:
    image: ${IMAGE_COSTRICT_WEB_PORTAL}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      API_URL: "http://costrict-web-api:8080"
    ports:
      - "${PORT_COSTRICT_WEB_PORTAL:-32440}:3000/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-api:
        condition: service_healthy
