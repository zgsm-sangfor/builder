services:
  costrict-web-portal:
    image: ${IMAGE_COSTRICT_WEB_PORTAL}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      PORT: "3000"
      API_URL: "http://costrict-web-api:8080"
      CLOUD_SERVER_HOST: "costrict-web-api"
      CLOUD_SERVER_PORT: "8080"
      VITE_API_PREFIX: "/cloud-api"
      VITE_BASE_PATH: "/cloud"
      VITE_APP_URL: "${COSTRICT_BASEURL}/cloud-api"
      VITE_DASHBOARD_PREFIX: "/cloud-dashboard"
      VITE_MULTICA_WEB_URL: "${COSTRICT_BASEURL}/workflow-web"
    ports:
      - "${PORT_COSTRICT_WEB_PORTAL:-32441}:3000/tcp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shenma
    depends_on:
      costrict-web-api:
        condition: service_healthy
