services:
  user-indicator-for-es:
    image: ${IMAGE_USER_INDICATOR_FOR_ES}
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./cert/ca.crt:/app/cert/ca.crt:ro
    environment:
      - GIN_MODE=debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
