services:
  postgres:
    image: ${IMAGE_POSTGRES}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${PASSWORD_POSTGRES}"
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/postgres/data:/var/lib/postgresql/data
      # 怎加挂载目录，用于其他特殊sql的执行
      - ${COSTRICT_DATA_DIR}/backend/postgres/sql:/mnt/sql
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PORT_POSTGRES}:5432/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shenma