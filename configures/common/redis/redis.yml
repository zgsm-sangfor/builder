services:
  redis:
    image: ${IMAGE_REDIS}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # ports:
    #   - "${PORT_REDIS}:6379"
    networks:
      - shenma