services:
  user-indicator:
    image: ${IMAGE_USER_INDICATOR}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${COSTRICT_DATA_DIR}/backend/user-indicator/data:/app/data
    environment:
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - shenma
