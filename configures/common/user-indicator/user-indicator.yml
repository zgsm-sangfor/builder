services:
  user-indicator:
    image: ${IMAGE_USER_INDICATOR}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./cert/ca.crt:/app/cert/ca.crt:ro
    environment:
      - GIN_MODE=debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - shenma