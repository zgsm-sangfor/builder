worker_processes auto;
error_log /dev/stderr;
pid /var/cache/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stderr main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 无尾斜杠时重定向，避免 alias 下 try_files 路径解析异常
        location = /costrict-admin {
            return 301 /costrict-admin/;
        }

        # index.html 禁止缓存，确保前端更新后用户立即获取最新版本
        location = /costrict-admin/index.html {
            alias /usr/share/nginx/html/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 静态资源目录：缺失时返回 404，不执行 SPA fallback
        # 防止 HTML 被当作 JS/CSS 解析导致静默空白页面
        location /costrict-admin/assets/ {
            alias /usr/share/nginx/html/assets/;
            try_files $uri =404;
        }
        location /costrict-admin/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /costrict-admin/index.html;
        }
        # 反向代理后端 API：/costrict-admin/api/* -> costrict-admin-backend 服务
        location /costrict-admin/api/ {
            proxy_pass http://costrict-admin-backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        # 反向代理后端 API：/authz/* -> authz 服务
        location /authz/ {
            proxy_pass http://authz:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 反向代理后端 API：/orgd/* -> orgd 服务
        location /orgd/ {
            proxy_pass http://orgd:8083;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 将 nginx 临时文件目录指向 emptyDir 卷（避免非 root 运行时的权限问题）
        client_body_temp_path /var/cache/nginx/client_temp;
        proxy_temp_path /var/cache/nginx/proxy_temp;
        fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
        uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
        scgi_temp_path /var/cache/nginx/scgi_temp;
    }
}
