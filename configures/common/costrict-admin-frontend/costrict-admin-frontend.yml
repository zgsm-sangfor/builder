services:
  costrict-admin-frontend:
    image: ${IMAGE_COSTRICT_ADMIN_FRONTEND}
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${COSTRICT_DATA_DIR}/backend/costrict-admin-frontend/logs:/app/logs
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shenma
